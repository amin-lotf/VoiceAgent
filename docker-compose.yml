services:
  app:
    build: .
    image: aminook/voiceagent:0.1.0
    container_name: voice_agent_app
    env_file:
      - .env.docker
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/voice_agent
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      - db
      - redis

  streamlit:
    image: aminook/voiceagent:0.1.0
    profiles:
      - streamlit
    env_file:
      - .env.docker
    environment:
      API_BASE_URL: http://app:8000/api/v1
    command: >
      sh -c "streamlit run src/voice_agent/frontend/streamlit_app.py
      --server.address ${STREAMLIT_HOST:-0.0.0.0}
      --server.port ${STREAMLIT_PORT:-8501}"
    ports:
      - "${STREAMLIT_PORT:-8501}:${STREAMLIT_PORT:-8501}"
    depends_on:
      - app

  react:
    image: node:22-alpine
    container_name: voice_agent_react
    profiles:
      - react
    working_dir: /app/src/voice_agent/frontend/react
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_WS_URL: ws://localhost:8000/api/v1/live/ws
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - react_node_modules:/app/src/voice_agent/frontend/react/node_modules
    ports:
      - "${REACT_PORT:-5173}:${REACT_PORT:-5173}"
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: voice_agent_db
    environment:
      POSTGRES_DB: voice_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - voice_agent_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8.6-alpine
    container_name: voice_agent_redis
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  voice_agent_pgdata:
  react_node_modules:
