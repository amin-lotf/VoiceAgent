services:
  app:
    build: .
    image: aminook/voiceagent:0.1.0
    container_name: voice_agent_app
    env_file:
      - .env.docker
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/voice_agent
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
      - "8501:8501"
    depends_on:
      - db
      - redis

  react:
    image: node:22-alpine
    container_name: voice_agent_react
    profiles:
      - react
    working_dir: /app/frontend/react
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_WS_URL: ws://localhost:8000/api/v1/live/ws
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: voice_agent_db
    environment:
      POSTGRES_DB: voice_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - voice_agent_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8.6-alpine
    container_name: voice_agent_redis
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  voice_agent_pgdata:
