services:
  app:
    build: .
    image: aminook/voiceagent:0.1.0
    container_name: voice_agent_app
    env_file:
      - .env.docker
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/voice_agent
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
      - "8501:8501"
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: voice_agent_db
    environment:
      POSTGRES_DB: voice_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - voice_agent_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8.6-alpine
    container_name: voice_agent_redis
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  voice_agent_pgdata: